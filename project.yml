name: Poolfold
options:
  bundleIdPrefix: com.poolfold
  deploymentTarget:
    iOS: "17.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Poolfold:
    type: application
    platform: iOS
    sources:
      - path: Poolfold
    dependencies:
      - target: PoolfoldWatch
        embed: true
      - target: Alamofire
    resources:
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poolfold.floor
        PRODUCT_NAME: Poolfold
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Avialobik
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  Alamofire:
    type: framework.static
    platform: iOS
    sources:
      - path: Vendor/Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poolfold.floor.alamofire
        PRODUCT_NAME: Alamofire
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        MACH_O_TYPE: staticlib
  PoolfoldWatch:
    type: application
    platform: watchOS
    sources:
      - path: Poolfold/ReviewLaunch.swift
      - path: PoolfoldWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poolfold.floor.watchkitapp
        PRODUCT_NAME: PoolfoldWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Avialobik
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.poolfold.floor
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  PoolfoldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PoolfoldTests
    dependencies:
      - target: Poolfold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poolfold.floor.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Poolfold.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Poolfold"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Poolfold:
    build:
      targets:
        Poolfold: all
        PoolfoldTests: [test]
    test:
      targets:
        - PoolfoldTests
  PoolfoldWatch:
    build:
      targets:
        PoolfoldWatch: all
